server {
    listen 8806;
    server_name localhost;
    client_max_body_size 100M;

    # OpenAPI 出口仅允许本机与内网网段访问，禁止公网直连（上游对接方需在同一内网或经反向代理白名单）
    location ^~ /resrun-paas/kaifangqian/openAPI {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;

        proxy_pass http://kfq-api:8899;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /resrun-paas/websocket {
        proxy_pass http://kfq-api:8899;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    location /resrun-paas {
        proxy_pass http://kfq-api:8899/resrun-paas;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location / {
        root /data/opensign-web;
        index index.html index.htm;
        try_files $uri $uri/ $uri.html /index.html;
    }
}
